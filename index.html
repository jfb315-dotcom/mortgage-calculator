<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HMS Mortgage Calculator</title>
<style>
    body {
        background-color: #121212;
        color: #ffffff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    h1 {
        color: #FF8200;
        text-align: center;
        margin-bottom: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #333;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: none;
        background-color: #2b2b2b;
        color: white;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background-color: #FF8200;
        border: none;
        border-radius: 5px;
        color: black;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background-color: #e67600;
    }

    .output-box {
        background-color: #2b2b2b;
        padding: 15px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid #444;
    }

    .alert-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
    }

    .alert-box {
        background: #1e1e1e;
        padding: 20px;
        border-radius: 10px;
        border: 2px solid #FF8200;
        text-align: center;
        width: 300px;
    }

    .alert-box button {
        margin-top: 15px;
        background: #FF8200;
        color: black;
    }
</style>
</head>

<body>

<h1>HMS Mortgage Calculator</h1>

<div class="container">

    <label>Loan Amount</label>
    <input type="number" id="loanAmount">

    <label>Interest Rate (%)</label>
    <input type="number" id="rate">

    <label>Term (Years)</label>
    <input type="number" id="term">

    <label>Loan Type</label>
    <select id="loanType">
        <option value="conv">Conventional</option>
        <option value="fha">FHA</option>
        <option value="va">VA</option>
    </select>

    <label>Purchase Price</label>
    <input type="number" id="purchasePrice">

    <label>Annual Taxes</label>
    <input type="number" id="taxes">

    <label>Annual Insurance</label>
    <input type="number" id="insurance">

    <label>HOA (Monthly)</label>
    <input type="number" id="hoa">

    <button onclick="calculate()">Calculate</button>
    <button onclick="resetCalc()">Reset</button>
    <button onclick="capture()">Copy Screenshot</button>

    <div class="output-box" id="results">
        <p><strong>P&I:</strong> <span id="pi"></span></p>
        <p><strong>Taxes:</strong> <span id="taxOut"></span></p>
        <p><strong>Insurance:</strong> <span id="insOut"></span></p>
        <p><strong>MI:</strong> <span id="miOut"></span></p>
        <p><strong>Total Payment:</strong> <span id="totalOut"></span></p>
    </div>
</div>

<!-- Custom Alert Modal -->
<div class="alert-modal" id="alertModal">
    <div class="alert-box">
        <p id="alertMessage">Screenshot copied!</p>
        <button onclick="closeAlert()">OK</button>
    </div>
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
function calculate() {
    let loan = Number(document.getElementById("loanAmount").value);
    let rate = Number(document.getElementById("rate").value) / 100 / 12;
    let term = Number(document.getElementById("term").value) * 12;
    let taxes = Number(document.getElementById("taxes").value) / 12;
    let insurance = Number(document.getElementById("insurance").value) / 12;
    let hoa = Number(document.getElementById("hoa").value);
    let price = Number(document.getElementById("purchasePrice").value);
    let type = document.getElementById("loanType").value;

    let pi = (loan * rate) / (1 - Math.pow(1 + rate, -term));
    document.getElementById("pi").innerText = pi.toFixed(2);
    document.getElementById("taxOut").innerText = taxes.toFixed(2);
    document.getElementById("insOut").innerText = insurance.toFixed(2);

    let ltv = loan / price;
    let mi = 0;

    if (type === "conv" && ltv > 0.80) {
        mi = (loan * 0.005) / 12;
    }

    document.getElementById("miOut").innerText = mi.toFixed(2);

    let total = pi + taxes + insurance + hoa + mi;
    document.getElementById("totalOut").innerText = total.toFixed(2);
}

function resetCalc() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.getElementById("pi").innerText = "";
    document.getElementById("taxOut").innerText = "";
    document.getElementById("insOut").innerText = "";
    document.getElementById("miOut").innerText = "";
    document.getElementById("totalOut").innerText = "";
}

function capture() {
    html2canvas(document.body).then(canvas => {
        canvas.toBlob(blob => {
            navigator.clipboard.write([
                new ClipboardItem({ "image/png": blob })
            ]).then(() => {
                showAlert("Screenshot copied to clipboard!");
            }).catch(() => {
                let url = URL.createObjectURL(blob);
                window.open(url, "_blank");
                showAlert("Screenshot opened in new tab.");
            });
        });
    });
}

function showAlert(msg) {
    document.getElementById("alertMessage").innerText = msg;
    document.getElementById("alertModal").style.display = "flex";
}

function closeAlert() {
    document.getElementById("alertModal").style.display = "none";
}
</script>

</body>
</html>
