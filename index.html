<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HMS Mortgage Calculator</title>

<style>
  body {
    background:#111217;
    color:white;
    font-family:Arial, sans-serif;
    padding:20px;
  }
  input, select {
    width:100%;
    padding:10px;
    margin-top:6px;
    margin-bottom:14px;
    border-radius:6px;
    border:1px solid #444;
    background:#1a1c22;
    color:white;
  }
  button {
    width:100%;
    padding:12px;
    background:#FF8200;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
  }
  #results {
    display:none;
    margin-top:20px;
    padding:20px;
    background:#1a1c22;
    border-radius:10px;
  }
</style>
</head>

<body>

<h2>HMS Mortgage Calculator</h2>

<label>Loan Type</label>
<select id="loanType" onchange="checkConventionalLTV(); calculatePayment();">
  <option>Conventional</option>
  <option>FHA</option>
  <option>VA</option>
  <option>USDA</option>
</select>

<label>Loan Amount</label>
<input id="loanAmount" type="number" oninput="calculatePayment();">

<label>Interest Rate (%)</label>
<input id="rate" type="number" step="0.01" oninput="calculatePayment();">

<label>Loan Term (Years)</label>
<input id="term" type="number" oninput="calculatePayment();">

<label>Loan-to-Value (%)</label>
<input id="ltv" type="number" oninput="checkConventionalLTV(); calculatePayment();">

<div id="convTip" style="
  display:none;
  margin-top:-8px;
  margin-bottom:12px;
  color:#FF8200;
  font-size:13px;
  font-weight:bold;
">
  For Conventional loans MI is factored based on LTV and Credit Score.<br>
  Please use .41 for an estimated figure.
</div>

<button onclick="calculatePayment()">Calculate</button>

<div id="results"></div>

<button id="saveShotBtn" style="display:none; margin-top:12px;" onclick="saveScreenshot()">
  Copy Screenshot
</button>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
function calculatePayment() {
  const loan = parseFloat(document.getElementById("loanAmount").value) || 0;
  const rate = (parseFloat(document.getElementById("rate").value) || 0) / 1200;
  const term = (parseFloat(document.getElementById("term").value) || 0) * 12;

  if (!loan || !rate || !term) return;

  const pmt = (loan * rate) / (1 - Math.pow(1 + rate, -term));

  document.getElementById("results").innerHTML = `
    <h3>Results</h3>
    <p><strong>P&I Payment:</strong> $${pmt.toFixed(2)}</p>
  `;

  document.getElementById("results").style.display = "block";
  document.getElementById("saveShotBtn").style.display = "block";
}

function checkConventionalLTV() {
  const loanType = document.getElementById("loanType").value;
  const ltv = parseFloat(document.getElementById("ltv").value);
  const tip = document.getElementById("convTip");

  if (loanType === "Conventional" && ltv > 80) {
    tip.style.display = "block";
  } else {
    tip.style.display = "none";
  }
}

async function saveScreenshot() {
  const results = document.getElementById("results");

  const canvas = await html2canvas(results, {
    scale: 2,
    backgroundColor: "#111217"
  });

  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));

  const imageItem = new ClipboardItem({ "image/png": blob });

  const signatureText =
    "Prepared by John Bischof — NMLS 165831 🏠\n" +
    "Home Mortgage Solutions\n" +
    "www.hmsloan.com — 423‑505‑9811";

  const textItem = new ClipboardItem({
    "text/plain": new Blob([signatureText], { type: "text/plain" })
  });

  try {
    await navigator.clipboard.write([imageItem, textItem]);
    showCustomAlert("Screenshot copied with message.");
    return;
  } catch (err) {
    console.log(err);
  }

  const url = URL.createObjectURL(blob);
  const newTab = window.open();
  newTab.document.write('<img src="' + url + '" style="width:100%;height:auto;">');
}

function showCustomAlert(msg) {
  const overlay = document.createElement("div");
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "rgba(0,0,0,0.6)";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.zIndex = "9999";

  const box = document.createElement("div");
  box.style.background = "#111217";
  box.style.color = "#FF8200";
  box.style.fontWeight = "bold";
  box.style.fontSize = "18px";
  box.style.padding = "24px 30px";
  box.style.borderRadius = "12px";
  box.style.boxShadow = "0 0 25px rgba(0,0,0,0.7)";
  box.style.textAlign = "center";
  box.style.maxWidth = "80%";

  const text = document.createElement("div");
  text.textContent = msg;

  const btn = document.createElement("div");
  btn.textContent = "OK";
  btn.style.marginTop = "20px";
  btn.style.padding = "10px 24px";
  btn.style.background = "#FF8200";
  btn.style.color = "#fff";
  btn.style.borderRadius = "8px";
  btn.style.cursor = "pointer";
  btn.style.display = "inline-block";
  btn.onclick = () => overlay.remove();

  box.appendChild(text);
  box.appendChild(btn);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
</script>

</body>
</html>
